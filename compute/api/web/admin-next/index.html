    $('#runBaseline', view).addEventListener('click', () => runSlot('baseline', edgeParams || getParams()));
    $('#runCandidate', view).addEventListener('click', () => runSlot('candidate', getParams()));
    async function runSlot(slot, params) {
      if (scope.since_id == null) { $('#paramNote', view).textContent = 'pick a day with frames first'; return; }
      try { await api('POST', '/api/tuning/rerun', { slot, params, since_id: scope.since_id, until_id: scope.until_id }); $('#paramNote', view).textContent = slot + ' enqueued'; pollJob(); }
      catch (e) { $('#paramNote', view).textContent = `${slot} failed: ${e.message}`; }
    }

    const rpct = (c, t) => (t ? Math.round((c / t) * 100) + '%' : '—');
    // A stat line reads LABEL (small caps, muted) then its value — the repo's readout
    // idiom, so the labels scan as captions rather than as part of the number.
    const sline = (pairs) => '<div class="sline">'
      + pairs.map(([k, v]) => `<div class="srow"><span class="sk">${k}</span><span class="sv">${v}</span></div>`).join('')
      + '</div>';
    // The params BEHIND this column (from the compare response, i.e. what actually
    // produced the numbers — not whatever is currently typed in the fields above).
    // Values differing from the live gate are marked, so a glance says what was changed.
    // `available` distinguishes "this compute build doesn't report params" from "this
    // slot never ran". Silently rendering nothing for the former looked like the feature
    // was missing when in fact the backend was simply older than the page (the dev proxy
    // serves a LOCAL admin-next against a REMOTE compute — changelog 129).
    function paramList(params, live, available) {
      if (!available) return '<div class="plist"><div class="note">Params unavailable — this compute build predates the per-column params field; pull + restart it.</div></div>';
      if (!params) return '<div class="plist"><div class="note">No params recorded — this slot has not been re-run.</div></div>';
      const rows = MOG2_PARAMS.map((k) => {
        const v = params[k];
        if (v == null) return '';
        // Compare numerically: the edge config and a slot's stored detail can spell the
        // same value differently (0.005 vs "0.0050"), which a string compare would
        // report as a change.
        const changed = live && live[k] != null && Number(live[k]) !== Number(v);
        return `<div class="prow${changed ? ' chg' : ''}"><span class="pk">${MOG2_LABEL[k]}</span><span class="pv">${v}</span></div>`;
      }).join('');
      return `<div class="plist">${rows}</div>`;
    }
    function scorecardHtml(title, sc, params, live, available, key) {
      if (!sc || sc.needs_rerun) return `<div class="stat"><div class="k">${title}</div><div class="note">not run yet</div>${paramList(params, live, available)}</div>`;
      // Under a regime scope the whole card IS that regime, so the Day/Night rows would
      // restate the headline against a denominator the other numbers no longer use.
      // Name the scope instead, so nobody reads a scoped recall as the day's overall.
      const split = sc.regime
        ? sline([['Scope', sc.regime === 'night' ? 'Night only' : 'Day only']])
        : sc.split
          ? sline([['Day', rpct(sc.split.day.caught, sc.split.day.total)], ['Night', rpct(sc.split.night.caught, sc.split.night.total)]]) : '';
      // Offer the panel when there is something in it AND the backend sent the records.
      // When there ARE misses but no records, SAY SO rather than rendering nothing:
      // FastAPI ignores an unknown `missed` query param, so an un-updated compute PC
      // answers 200 with no list, and silence there reads as "this feature doesn't
      // exist" instead of "your backend is behind" (changelog 164's lesson — and the
      // dev proxy serves a LOCAL admin-next against a REMOTE compute, so it is routine).
      const nMissed = sc.visits.wholly_missed;
      const btn = nMissed === 0 ? ''
        : Array.isArray(sc.missed_visits)
          ? `<button class="mv-btn" data-col="${key}" style="margin-top:10px;width:100%">Show missed (${fmtInt(nMissed)})</button>`
          : '<div class="note" style="margin-top:10px">Missed-visit review needs a newer compute build — pull + restart it.</div>';
      return `<div class="stat">
        <div class="k">${title}</div>
        <div class="v">${rpct(sc.visits.caught, sc.visits.total)}</div>
        ${sline([['Recall', `${fmtInt(sc.visits.caught)}/${fmtInt(sc.visits.total)} visits`]])}
        ${sline([['Missed', fmtInt(sc.recall.missed)], ['False', fmtInt(sc.false_triggers.count)]])}
        ${split}
        ${paramList(params, live, available)}
        ${btn}
      </div>`;
    }
    $('#compareBtn', view).addEventListener('click', compare);
    // All / Day / Night SCOPES the scoring, never the re-run's frame set — MOG2 is
    // stateful, so filtering its input frames would shatter the rolling background.
    // Deliberately NOT persisted: a scoring filter that survives a reload is an easy
    // way to misread a scorecard days later, so it resets to All on every mount.
    let regime = '';
    $('#regimeSel', view).addEventListener('click', (e) => {
      const b = e.target.closest('button[data-regime]');
      if (!b) return;
      regime = b.dataset.regime;
      $('#regimeSel', view).querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x === b));
      if (lastCompare) compare();                     // re-score only if there is a result to re-score
    });
    async function compare() {
      const el = $('#scorecards', view);
      if (scope.since_id == null) { el.innerHTML = '<span class="note warn">Pick a day with frames first.</span>'; return; }
      el.innerHTML = '<span class="note">Comparing…</span>';
      closeMissed();                                  // its rows belong to the PREVIOUS response
      const q = new URLSearchParams({ oracle: 'yolo-serial', split: 'true', missed: 'true', since_id: scope.since_id, until_id: scope.until_id });
      if (regime) q.set('regime', regime);
      try {
        const r = await api('GET', '/api/tuning/compare?' + q);
        if (!alive) return;
        // The live gate is the reference every other column's params are diffed against.
        // A response with no `params` at all is an OLDER compute build, not a store with
        // nothing recorded — the two get different notes.
        const p = r.params || {};
        const has = !!r.params;
        lastCompare = r;
        el.innerHTML = scorecardHtml('Live gate', r.live, p.live, null, has, 'live')
          + scorecardHtml('Baseline', r.baseline, p.baseline, p.live, has, 'baseline')
          + scorecardHtml('Candidate', r.candidate, p.candidate, p.live, has, 'candidate');
        el.querySelectorAll('.mv-btn').forEach((b) => b.addEventListener('click', () => toggleMissed(b.dataset.col)));
        const sn = $('#splitNote', view);
        // A regime we ASKED for that the response doesn't echo means the compute is
        // behind: FastAPI ignores an unknown query param, so it answers 200 with
        // UNSCOPED numbers while the Night button sits selected. Say so rather than
        // let the selector look like it did something (changelog 164/173 — the dev
        // proxy serves a LOCAL admin-next against a REMOTE compute, so this is routine).
        if (regime && !(r.live || {}).regime) {
          sn.textContent = `Showing ALL — this compute build predates regime scoping; pull + restart it.`;
          sn.classList.add('warn');
          return;
        }
        sn.classList.remove('warn');
        if (r.split_available && r.location) sn.textContent = `Day/Night @ ${r.location.latitude.toFixed(2)}, ${r.location.longitude.toFixed(2)}`;
        else if (r.split_reason === 'location_unset') sn.textContent = 'Day/Night off — set a location on Start.';
        else if (r.split_reason === 'astral_unavailable') sn.textContent = 'Day/Night off — astral unavailable.';
        else sn.textContent = '';
        setRegimeEnabled(!!r.split_available, r.split_reason);
      } catch (e) {
        // A regime ask the backend can't honor 400s (no location, or no astral — the
        // mount probe can only see the first). Left alone the buttons stay enabled and
        // selected, every retry 400s the same way, and the operator has lost the
        // working All scorecards with no cue that All is the way back. So disable them,
        // fall back to All, and re-run so numbers reappear.
        const m = /unavailable \(([a-z_]+)\)/.exec(e.message || '');
        if (regime && m) {
          setRegimeEnabled(false, m[1]);              // also resets `regime` to ''
          $('#splitNote', view).textContent = m[1] === 'astral_unavailable'
            ? 'Day/Night off — astral unavailable.' : 'Day/Night off — set a location on Start.';
          compare();                                  // now unscoped: show All again
          return;
        }
        el.innerHTML = `<span class="note bad">${e.message}</span>`;
      }
    }
    // A Day/Night button that silently scores nothing is worse than one that says why
    // it can't, so they DISABLE without a location (or without astral) rather than
    // returning a card the operator would read as that regime's numbers.
    function setRegimeEnabled(ok, reason) {
      $('#regimeSel', view).querySelectorAll('button[data-regime]:not([data-regime=""])').forEach((b) => {
        b.disabled = !ok;
        b.title = ok ? '' : (reason === 'astral_unavailable'
          ? 'astral is unavailable on the compute box' : 'set a location on the Start page');
      });
      if (!ok && regime) {                            // an active scope just became invalid
        regime = '';
        $('#regimeSel', view).querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x.dataset.regime === ''));
      }
    }
    // Ask up front so the buttons are honest BEFORE the first compare, rather than
    // looking available until someone clicks one and gets an error.
    (async () => {
      try {
        const loc = await api('GET', '/api/location');
        if (alive) setRegimeEnabled(loc && loc.latitude != null, 'location_unset');
      } catch (_) {}
    })();

    // --- Missed-visit panel -------------------------------------------------
    //
    // One column's wholly-missed visits, chronological, each an inline filmstrip.
    // Only ONE column is open at a time and the order is stable by time, so toggling
    // Live gate -> Candidate reads as a DIFF: rows hold their place and a visit the
    // candidate recovered simply disappears.
    const COL_TITLE = { live: 'Live gate', baseline: 'Baseline', candidate: 'Candidate' };
    const MV_STRIP_MAX = 24;                   // tiles per visit; a longer visit decimates
    // The four gate reject paths, listed by BLOB SIZE (nothing → under-min → in-band →
    // over-max) so a split reads as a distribution rather than an arbitrary order. The
    // hint says what actually happened: "near zero" alone doesn't explain itself.
    const MISS_ORDER = ['near_zero', 'below_min', 'in_band', 'above_max'];
    const MISS_REASON = {
      near_zero: { label: 'No foreground found', short: 'none',
        hint: 'MOG2 saw almost nothing — the cat was likely read as a SHADOW (dark cat on a lighter floor) or absorbed into the background. Lowering var threshold helps at the margin; a true shadow no parameter recovers.' },
      below_min: { label: 'Blob under min area', short: 'small',
        hint: 'A real blob, but smaller than min area — a distant, partial or half-entered cat.' },
      above_max: { label: 'Blob over max area', short: 'large',
        hint: 'The blob was bigger than max area fraction, so the gate discarded it as a whole-ROI light change. Typical of a cat directly under a top-down camera.' },
      in_band: { label: 'Debounce dropped it', short: 'debounce',
        hint: 'The blob was inside the band — only the persistence streak stopped it firing.' },
    };
    let lastCompare = null, openCol = null, mvObserver = null;

    function closeMissed() {
      openCol = null;
      if (mvObserver) { mvObserver.disconnect(); mvObserver = null; }
      const el = $('#missedPanel', view);
      // Drop the class too, not just the content: .mv-open carries a top border and
      // padding that would otherwise leave a stray rule under an empty panel.
      if (el) { el.className = ''; el.innerHTML = ''; }
      view.querySelectorAll('.mv-btn').forEach((b) => b.classList.remove('primary'));
    }
    function toggleMissed(col) {
      const reopening = openCol === col;
      closeMissed();
      if (!reopening) renderMissed(col);
    }
    function renderMissed(col) {
      const sc = lastCompare && lastCompare[col];
      const recs = (sc && sc.missed_visits) || [];
      openCol = col;
      const btn = view.querySelector(`.mv-btn[data-col="${col}"]`);
      if (btn) btn.classList.add('primary');
      // Under motion-only capture (or across a cleanup purge) the non-motion frames a
      // miss LIVES IN were never stored, so a short/empty list there is an absence of
      // evidence, not good recall. Shown even when the list is empty — that is the
      // case it exists for.
      const spans = (lastCompare && lastCompare.motion_only_spans) || [];
      const caveat = spans.length
        ? `<p class="note warn" style="margin:0 0 10px">Misses are <b>unmeasurable</b> across ${spans.length} span${spans.length === 1 ? '' : 's'} of this window — it was captured motion-only, or a cleanup purge stripped its non-motion frames. Anything the gate missed there was never stored.</p>`
        : '';
      // A backend that sends records but no `reason` is the in-between build: it has
      // the missed-visit list but not the per-frame MOG2 attribution. Say which half is
      // missing, rather than just quietly omitting every why-line.
      const stale = recs.length && !recs[0].reason
        ? '<p class="note" style="margin:0 0 10px">Per-frame MOG2 attribution (why each visit was missed) needs a newer compute build — pull + restart it.</p>'
        : '';
      const head = `<div class="row" style="margin-bottom:10px">
          <b class="grow">${COL_TITLE[col] || col} — ${fmtInt(recs.length)} missed visit${recs.length === 1 ? '' : 's'}</b>
          <button id="mvClose">Close</button>
        </div>${caveat}${stale}`;
      const body = recs.length
        ? recs.map((r, i) => mvRowHtml(r, i)).join('')
        : '<span class="note">No wholly-missed visits in this window for this column.</span>';
      const el = $('#missedPanel', view);
      el.className = 'mv-open';
      el.innerHTML = head + body;
      $('#mvClose', el).addEventListener('click', closeMissed);
      observeStrips(el, recs);
    }
    function mvRowHtml(r, i) {
      const dur = Math.max(0, r.end_ts - r.start_ts) / 1000;
      const tag = r.night === true ? '<span class="mv-tag">night</span>'
        : r.night === false ? '<span class="mv-tag">day</span>' : '';
      const peak = r.peak_score == null ? '—' : Math.round(r.peak_score * 100) + '%';
      return `<div class="mv-row" data-i="${i}">
        <div class="mv-head">
          <span class="mv-when">${fmtClock(r.start_ts)}</span>
          <span><span class="mv-k">for</span>${dur.toFixed(1)}s</span>
          <span><span class="mv-k">detected</span>${fmtInt(r.n_present)}</span>
          <span><span class="mv-k">peak</span>${peak}</span>
          ${tag}
          <span class="grow"></span>
          <span class="note">#${fmtInt(r.start_id)}–${fmtInt(r.end_id)}</span>
        </div>
        ${whyHtml(r)}
        <div class="mv-body"><div class="mv-ph"><img loading="lazy" src="/media/${r.rep_frame_id}" alt=""></div></div>
      </div>`;
    }
    // Why the gate dropped this visit, and the knob that would recover it. The reason
    // is the dominant bucket across the visit's own frames (server-side, against the
    // params THAT column ran with), with the full split beside it so a mixed visit
    // isn't reduced to a single word.
    function whyHtml(r) {
      if (!r.reason || !r.buckets) return '';       // older compute build — say nothing
      const b = MISS_REASON[r.reason] || { label: r.reason, hint: '' };
      const split = MISS_ORDER.filter((k) => r.buckets[k]).map((k) =>
        `<span class="mv-b"><i class="mv-dot ${k}"></i>${(MISS_REASON[k] || {}).short || k} ${fmtInt(r.buckets[k])}</span>`).join('');
      const fix = r.fix
        ? `<span class="mv-fix ${r.reason === 'near_zero' ? 'weak' : ''}">${MOG2_LABEL[r.fix.param] || r.fix.param} ${r.fix.direction === 'up' ? '↑ raise' : '↓ lower'}</span>`
        : '';
      return `<div class="mv-why">
        <span class="mv-reason"><i class="mv-dot ${r.reason}"></i>${b.label}</span>
        ${fix}
        <span class="mv-split">${split}</span>
        <span class="grow"></span>
        <span class="note mv-hint">${b.hint}</span>
      </div>`;
    }
    // Each row fetches its own strip, and only once it scrolls into view: the list is
    // uncapped, so an eager load would fire one request per miss the instant the panel
    // opens. Results are cached on the row, so scrolling back up re-renders from memory.
    function observeStrips(root, recs) {
      if (mvObserver) mvObserver.disconnect();
      const loaded = new Set();
      // Pin the column this observer belongs to: an in-flight strip fetch must not
      // paint after the operator has switched columns (its row is detached by then,
      // so it would be silent wasted work rather than a wrong render).
      const myCol = openCol;
      const load = async (rowEl, rec) => {
        const body = $('.mv-body', rowEl);
        try {
          const q = new URLSearchParams({
            count: MV_STRIP_MAX, since_id: rec.start_id, until_id: rec.end_id, detections: 'yolo-serial',
          });
          const data = await api('GET', '/api/frames/sample?' + q);
          if (!alive || openCol !== myCol) return;
          const frames = Array.isArray(data) ? data : (data.frames || []);
          if (!frames.length) { body.innerHTML = '<span class="note">No frames — they may have been evicted.</span>'; return; }
          // The strip covers the visit's whole id SPAN, so it also holds the frames
          // between the detections — `n_present` is not its denominator, and neither
          // is MV_STRIP_MAX (the server decimates by a stride, so a capped response
          // lands BELOW the count it was asked for). The span width is the honest
          // denominator; an eviction gap inside it would over-report sampling, which
          // is the safe direction — never claim the whole visit is on screen when it
          // isn't (the honesty entry 154 had to retrofit onto Frame review).
          const span = rec.end_id - rec.start_id + 1;
          const note = frames.length < span
            ? `<div class="note" style="margin-bottom:6px">${fmtInt(frames.length)} of ${fmtInt(span)} frames in this visit's span (sampled)</div>` : '';
          // The visit's own per-frame MOG2 readings, keyed by frame id: the strip spans
          // the whole id range, so the frames BETWEEN detections have no reading and
          // correctly get no chip (they were not part of the miss).
          const mog = new Map((rec.frames || []).map((x) => [x.id, x]));
          body.innerHTML = note + `<div class="fgrid mv-strip">${frames.map((f) => mvTileHtml(f, mog.get(f.id))).join('')}</div>`;
          placeBoxes(body);
          // Click a tile to enlarge it, the same modal Frame review opens. The strip
          // is rendered in `frames` order, so the tile index indexes straight back in.
          body.querySelectorAll('.ftile').forEach((t, i) => t.addEventListener('click', () => {
            const f = frames[i];
            openFrameModal(f, `${fmtTs(f.recv_ts)} · frame ${f.id} · det: ${detLabel(f)} · missed visit ${fmtClock(rec.start_ts)}`);
          }));
        } catch (e) {
          if (alive && openCol === myCol) body.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
        }
      };
      // Hold the observer in a local: closeMissed() nulls `mvObserver`, and a callback
      // already queued when it did would then throw on `.unobserve`.
      const obs = new IntersectionObserver((entries) => {
        for (const en of entries) {
          if (!en.isIntersecting) continue;
          const i = Number(en.target.dataset.i);
          if (loaded.has(i)) continue;
          loaded.add(i);
          obs.unobserve(en.target);
          load(en.target, recs[i]);
        }
      }, { root: null, rootMargin: '200px' });
      mvObserver = obs;
      root.querySelectorAll('.mv-row').forEach((el) => obs.observe(el));
    }
    // `m` is this frame's MOG2 reading ({area, bucket}) when it is one of the visit's
    // detected frames; absent for the in-between frames the id span also covers.
    function mvTileHtml(f, m) {
      const boxDiv = f.box ? `<div class="fbox ${bandOf(f.score)}" hidden></div>` : '';
      const boxAttr = f.box ? `data-box='${JSON.stringify(f.box)}'` : '';
      // Area in the same unit min_area / max_area_fraction use, so the number reads
      // straight against the param fields above, dotted by the test it failed.
      const chip = m ? areaChip(m.area, m.bucket, (MISS_REASON[m.bucket] || {}).label) : '';
      return `<div class="ftile">
        <div class="fimg"><img loading="lazy" src="${f.url}" ${boxAttr}>${boxDiv}${frameDetChip(f, 'at-br')}
          ${chip ? `<div class="tchips">${chip}</div>` : ''}</div>
        <div class="fmeta"><span>${fmtClock(f.recv_ts)}</span><span>#${f.id}</span></div>
      </div>`;
    }

    // --- Queue tables (the shared renderer, fed from the analysis status poll) ---
    const KIND_NAME = { 'yolo-serial': 'YOLO coverage', 'mog2:baseline': 'MOG2 baseline', 'mog2:candidate': 'MOG2 candidate' };
    const kindName = (k) => KIND_NAME[k] || k;   // fallback: raw kind (a stray bsuv/corruption job)
    // Bucket the label's day with the SAME fixed `off` the calendar uses (read ms+off as
    // UTC), so a job's day label can't drift from its calendar cell across a DST/midnight edge.
    const dayLabel = (ts) => { if (!ts) return ''; const d = new Date(ts + off), p = (x) => String(x).padStart(2, '0'); return `${WD[(d.getUTCDay() + 6) % 7]} ${p(d.getUTCDate())}/${p(d.getUTCMonth() + 1)}`; };
    const jobName = (kind, ts, rerun) => `${kindName(kind)}${ts ? ' · ' + dayLabel(ts) : ''}${rerun ? ' · rerun' : ''}`;
    const cancelJob = (jobId) => api('POST', '/api/analysis/cancel/' + jobId).catch(() => {}).then(() => { if (alive) pollJob(); });

    // Running-job rate, ported from /admin's etaAnchor: r = frames done / seconds since the
    // anchor, re-anchored per running-job identity (and on done<done0 for back-to-back
    // same-analyzer jobs). Only the running row shows FPS + ETA (queued rows show '—').
    let etaAnchor = null;
    function runningRate(s) {
      const key = [s.analyzer, s.since_id, s.until_id, s.total].join('|'), now = Date.now();
      if (!etaAnchor || etaAnchor.key !== key || s.done < etaAnchor.done0) etaAnchor = { key, t0: now, done0: s.done };
      const dt = (now - etaAnchor.t0) / 1000, dd = s.done - etaAnchor.done0;
      if (dt <= 0 || dd <= 0 || !s.total) return { fpsText: '…', etaText: '…' };
      const r = dd / dt;
      return { fpsText: r.toFixed(1), etaText: fmtDuration(Math.max(0, s.total - s.done) / r) };
    }

    let wasRunning = false;
    async function pollJob() {
      try {
        const s = await api('GET', '/api/analysis/status');
        if (!alive) return;
        const jl = $('#jobLine', view);
        const rate = s.running ? runningRate(s) : null;
        const rowsFor = (cat) => {
          const rows = [];
          if (s.running && s.category === cat) rows.push({
            jobId: s.job_id, status: 'running', name: jobName(s.analyzer, s.since_ts, s.reanalyze),
            pctText: s.total ? Math.round(s.done / s.total * 100) + '%' : '…',
            xy: `${fmtInt(s.done)} / ${fmtInt(s.total)}`, fpsText: rate.fpsText, etaText: rate.etaText,
          });
          for (const j of (s.queue || [])) {
            if (j.category !== cat) continue;
            rows.push({
              jobId: j.job_id, status: 'queued', name: jobName(j.kind, j.since_ts, j.reanalyze),
              pctText: '—', xy: `0 / ${j.total != null ? fmtInt(j.total) : '…'}`, fpsText: '—', etaText: '—',
            });
          }
          return rows;
        };
        renderQueue($('#covQueue', view), rowsFor('coverage'), cancelJob);
        renderQueue($('#mogQueue', view), rowsFor('mog2'), cancelJob);
        renderQueue($('#litQueue', view), rowsFor('lighting'), cancelJob);
        if (s.running) { wasRunning = true; jl.textContent = ''; }  // the table shows the running job
        else {
          jl.textContent = s.error ? ('last error: ' + s.error) : 'idle';
          // Refresh the day's coverage after ANY sweep finishes — a lighting run
          // changes the histogram and the LIGHT cell just as a YOLO run changes its own.
          if (wasRunning) { wasRunning = false; loadCalendar(); loadLighting(); }
        }
      } catch (_) {}
    }

    (async () => {
      try { const ec = await api('GET', '/api/edge/config'); if (alive) { edgeParams = ec.params; setParams(ec.params); $('#paramNote', view).textContent = ec.source === 'edge' ? 'params seeded from the edge' : 'edge unreachable — using built-in defaults'; } } catch (_) {}
      await loadCalendar();
      pollJob();
    })();
    const timer = setInterval(pollJob, 3000);
    // Disconnect the strip observer on nav: it holds refs to this view's rows, and an
    // in-flight strip fetch must not paint into a torn-down DOM (`alive` guards that).
    // The enlarge modal lives on document.body, so it outlives the view unless closed.
    return () => { alive = false; clearInterval(timer); if (mvObserver) mvObserver.disconnect(); closeFrameModal(); };
  }

  // =======================================================================
  //  Frame review page (admin-next P3) — per-frame YOLO + identity overlays
  // =======================================================================
  function mountFrames(view) {
    // A window is a START instant + a TIMESPAN (the corruption page's picker shape),
    // so an operator can land on the minute a visit happened instead of scrolling a
    // whole decimated day. There is no frame-count field: the window's own width
    // bounds the grid, and F_MAX_TILES caps what a wide span can dump.
    const SPANS = [1, 5, 10, 15, 30, 60];
    const F_MAX_TILES = 500;

    view.innerHTML = `
      <div class="card">
        <h3>Window</h3>
        <div class="row">
          <label class="fld">Start<input id="fStart" type="datetime-local" step="60"></label>
          <label class="fld">Timespan<select id="fSpan">${SPANS.map((m) => `<option value="${m}"${m === 5 ? ' selected' : ''}>${m} min</option>`).join('')}</select></label>
          <button id="fLoad" class="primary" style="align-self:flex-end">Load</button>
          <span id="fScope" class="note"></span>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="seg" id="fFilters">
            <button data-f="all" class="sel">All</button>
            <button data-f="detected">Detected</button>
            <button data-f="identified">Identified</button>
          </div>
          <span id="fCounts" class="note"></span>
        </div>
      </div>
      <div class="card">
        <h3>Frames <span class="note">(YOLO box + identity overlay)</span></h3>
        <p class="hint" style="margin-top:0">
          <span class="swatch f-motion"></span>the edge gate saw motion ·
          <span class="swatch f-corrupt"></span>corrupt frame (outranks motion) —
          only marked where a corruption sweep has run, so an unmarked frame is
          <i>unmeasured</i>, not proven clean.
          The lighting chip shows DAY/NIGHT and the colourfulness behind it; a dimmed
          one is <i>assumed</i> day (measured, but no cutoff set on Motion tuning), and
          no chip means the lighting sweep has not reached that frame.
        </p>
        <div id="fGrid" class="fgrid"><span class="note">Pick a start time and Load.</span></div>
      </div>
    `;

    let alive = true;
    let frames = [];
    let filter = 'all';

    // datetime-local speaks LOCAL wall-clock in both directions, so a plain
    // new Date(value) round-trips it against the store's epoch-ms timestamps.
    const p2 = (x) => String(x).padStart(2, '0');
    const toLocalInput = (ms) => {
      const d = new Date(ms);
      return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
    };
    const windowMs = () => {
      const v = $('#fStart', view).value;
      if (!v) return null;
      const start = new Date(v).getTime();
      if (!isFinite(start)) return null;
      const span = Number($('#fSpan', view).value) * 60000;
      return { start, end: start + span - 1 };
    };

    const passes = (f) => (filter === 'detected' ? !!f.box : filter === 'identified' ? !!f.identity : true);
    // Corruption outranks motion: a corrupt frame's motion verdict isn't trustworthy, so
    // saying "the gate fired here" would be the more misleading of the two labels.
    const tileFlag = (f) => (f.corrupt ? ' f-corrupt' : f.motion ? ' f-motion' : '');
    function tileHtml(f, idx) {
      const boxDiv = f.box ? `<div class="fbox ${bandOf(f.score)}" hidden></div>` : '';
      const boxAttr = f.box ? `data-box='${JSON.stringify(f.box)}'` : '';
      const t = new Date(f.recv_ts);
      // The gate's blob area for this frame, on EVERY frame (it is measured whether or
      // not motion fired) — so the value behind a motion=1 tile and the value behind a
      // still one can be compared by eye against min_area / max_area_fraction. No
      // bucket dot here: this page holds no thresholds, so it states the number and
      // makes no judgement.
      return `<div class="ftile${tileFlag(f)}" data-i="${idx}">
        <div class="fimg"><img loading="lazy" src="${f.url}" ${boxAttr}>${boxDiv}
          <div class="tchips">${identityChip(f.identity)}${lightingChip(f)}${areaChip(f.area)}</div>${frameDetChip(f, 'at-br')}</div>
        <div class="fmeta"><span>${p2(t.getHours())}:${p2(t.getMinutes())}:${p2(t.getSeconds())}</span><span>#${f.id}</span></div>
      </div>`;
    }
    function renderGrid() {
      const grid = $('#fGrid', view);
      if (!frames.length) { grid.innerHTML = '<span class="note">No frames loaded.</span>'; $('#fCounts', view).textContent = ''; return; }
      const shown = frames.map((f, i) => [f, i]).filter(([f]) => passes(f));
      $('#fCounts', view).textContent = `${fmtInt(shown.length)} / ${fmtInt(frames.length)} match filter`;
      if (!shown.length) { grid.innerHTML = '<span class="note">No frames match this filter.</span>'; return; }
      grid.innerHTML = shown.map(([f, i]) => tileHtml(f, i)).join('');
      placeBoxes(grid);
      grid.querySelectorAll('.ftile').forEach((t) => t.addEventListener('click', () => openFrame(Number(t.dataset.i))));
    }
    // The modal itself (and its Escape handling) is the shared openFrameModal; this
    // page only supplies the meta line, which is the richest of them — it is the one
    // grid that loads identity and the motion/corrupt review flags.
    function openFrame(idx) {
      const f = frames[idx];
      const idTxt = identityKind(f.identity)
        ? `${identityKind(f.identity)}${f.identity.cat_name ? ' · ' + f.identity.cat_name : ''}${f.identity.distance != null ? ' (d=' + f.identity.distance.toFixed(3) + ')' : ''}`
        : 'no identity';
      const marks = [
        f.motion ? 'motion' : '',
        f.area === undefined ? '' : `blob ${fmtArea(f.area)}`,
        f.corrupt ? 'CORRUPT' : (f.corrupt === null ? 'corruption not measured' : ''),
        f.lighting == null
          ? 'lighting not measured'
          : `${f.lighting}${f.lighting_calibrated ? '' : ' (assumed)'} ${f.colourfulness == null ? '' : f.colourfulness.toFixed(3)}`.trim(),
      ].filter(Boolean).join(' · ');
      openFrameModal(f, `${fmtTs(f.recv_ts)} · frame ${f.id} · det: ${detLabel(f)} · id: ${esc(idTxt)}${marks ? ' · ' + marks : ''}`);
    }

    $('#fFilters', view).addEventListener('click', (e) => {
      const b = e.target.closest('button[data-f]'); if (!b) return;
      filter = b.dataset.f;
      view.querySelectorAll('#fFilters button').forEach((x) => x.classList.toggle('sel', x.dataset.f === filter));
      renderGrid();
    });
    // One Load does both steps: resolve the clock window to the id bounds every scoped
    // read shares, then sample it. Nothing is fetched until the operator asks.
    async function load() {
      const grid = $('#fGrid', view), scopeEl = $('#fScope', view);
      const w = windowMs();
      if (!w) { grid.innerHTML = '<span class="note warn">Pick a start time.</span>'; return; }
      grid.innerHTML = '<span class="note">Loading…</span>';
      scopeEl.textContent = 'resolving…';
      let scope;
      try {
        const r = await api('GET', `/api/frames/resolve?start_ts=${w.start}&end_ts=${w.end}`);
        if (!alive) return;
        scope = r;
      } catch (e) {
        frames = []; $('#fCounts', view).textContent = '';
        scopeEl.textContent = 'resolve failed';
        grid.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
        return;
      }
      if (scope.since_id == null) {
        scopeEl.textContent = 'no frames in this window';
        frames = []; $('#fCounts', view).textContent = '';
        grid.innerHTML = '<span class="note warn">No frames in this window.</span>';
        return;
      }
      scopeEl.textContent = `frames ${fmtInt(scope.since_id)}–${fmtInt(scope.until_id)}`;
      const q = new URLSearchParams({ count: F_MAX_TILES, since_id: scope.since_id, until_id: scope.until_id, detections: 'yolo-serial', identify: 'true', flags: 'true' });
      const cq = `?since_id=${scope.since_id}&until_id=${scope.until_id}`;
      try {
        // The sample is decimated ABOVE F_MAX_TILES and complete below it, and the
        // response can't tell the two apart — so read the window's real frame total
        // (and its YOLO sweep coverage, which is what the "unswept" chips reflect)
        // rather than implying the whole window is on screen. Coverage is advisory:
        // if it fails the grid still renders, just without the denominator.
        const [data, cov] = await Promise.all([
          api('GET', '/api/frames/sample?' + q),
          api('GET', '/api/analysis/coverage' + cq).catch(() => null),
        ]);
        if (!alive) return;
        frames = Array.isArray(data) ? data : (data.frames || []);
        renderGrid();
        const parts = [`frames ${fmtInt(scope.since_id)}–${fmtInt(scope.until_id)}`];
        if (cov && cov.total != null) {
          parts.push(`${fmtInt(frames.length)} of ${fmtInt(cov.total)} loaded${frames.length < cov.total ? ' (sampled)' : ''}`);
          const swept = cov.oracles && cov.oracles['yolo-serial'];
          if (swept) parts.push(`${fmtInt(swept.analyzed)} swept by YOLO`);
        } else {
          parts.push(`${fmtInt(frames.length)} loaded`);
        }
        scopeEl.textContent = parts.join(' · ');
      } catch (e) {
        // Drop the previous window's frames: the scope readout now describes THIS
        // window, so keeping them would let a filter click re-render stale tiles under
        // the new window's label.
        frames = []; $('#fCounts', view).textContent = '';
        grid.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
      }
    }
    $('#fLoad', view).addEventListener('click', load);
    // Re-widen/narrow an ALREADY-loaded window in place; before the first Load a span
    // change must not fetch anything on its own.
    $('#fSpan', view).addEventListener('change', () => { if (frames.length) load(); });

    // Default the picker to the newest frames, minus the span, so the first Load lands
    // on real data instead of an empty window.
    (async () => {
      try {
        const st = await api('GET', '/api/stats');
        if (!alive || !st.newest_ts) return;
        const span = Number($('#fSpan', view).value) * 60000;
        $('#fStart', view).value = toLocalInput(st.newest_ts - span);
        $('#fScope', view).textContent = `store: ${fmtTs(st.oldest_ts)} → ${fmtTs(st.newest_ts)}`;
      } catch (_) {}
    })();
    return () => { alive = false; closeFrameModal(); };
  }

  // =======================================================================
  //  Annotation page (admin-next P4) — keyboard-first labelling queue
  // =======================================================================
  function mountAnnotate(view) {
    view.innerHTML = `
      <div class="card">
        <div class="row">
          <div class="seg" id="aMode">
            <button data-m="queue" class="sel">Queue</button>
            <button data-m="labelled">Labelled</button>
          </div>
          <label class="fld inline" id="aFilterWrap" style="display:none">Show label<select id="aFilter"></select></label>
          <span id="aStatus" class="note grow">Loading queue…</span>
          <button id="aReload">Reload</button>
        </div>
      </div>
      <div class="card">
        <div id="aStage"><span class="note">Loading…</span></div>
        <p class="hint" id="aHint"></p>
      </div>
      <div class="card">
        <h3>Roster</h3>
        <div id="aRoster" class="row"></div>
        <p class="hint">The digit legend, not a roster editor — add, rename, retire, and read
          per-cat crop coverage on <a href="#cats">Cats</a>.</p>
      </div>
    `;

    let alive = true;
    let visits = [], idx = 0, cats = [], hasModel = false, truncated = false, lastAction = null;
    // Labelled review: the decided mirror of the queue. `labAll` is what the server
    // returned, `lab` the subset the "Show label" filter shows — kept apart so a
    // requeue can drop the visit from BOTH (dropping it only from the filtered view
    // resurrects it the moment the filter is re-derived).
    let mode = 'queue', busy = false, labAll = [], lab = [], labIdx = 0;

    const bboxArea = (b) => (b ? Math.max(0, b[2] - b[0]) * Math.max(0, b[3] - b[1]) : 0);
    function seedQuality(f, v) {
      const ratio = v.peak_area ? bboxArea(f.bbox) / v.peak_area : 0;
      if (f.score >= 0.6 && ratio >= 0.7) return 'gallery';
      if (f.score < 0.35 || ratio < 0.3) return 'poor';
      return 'ok';
    }
    const cropUrl = (f) => `/api/label/crop/${f.id}?box=${f.bbox.map(Math.round).join(',')}`;
    const current = () => visits[idx];
    const flash = (m) => { $('#aStatus', view).textContent = m; };

    function renderStatus() {
      const el = $('#aStatus', view);
      if (mode === 'queue') {
        el.textContent = visits.length
          ? `Visit ${idx + 1} / ${visits.length}${truncated ? '+' : ''} · ${hasModel ? 'worst-first' : 'newest-first'}`
          : 'Queue empty';
      } else {
        el.textContent = lab.length
          ? `Visit ${labIdx + 1} / ${lab.length} · newest-labelled first`
          : (labAll.length ? 'No visits carry that label' : 'Nothing labelled yet');
      }
    }
    function renderVisit() {
      renderStatus();
      const stage = $('#aStage', view), v = current();
      if (!v) { stage.innerHTML = '<span class="note">Nothing to annotate — the queue is clear. 🎉</span>'; return; }
      const rep = v.frames.find((f) => f.id === v.rep_frame_id) || v.frames[0];
      const dist = (hasModel && v.distance != null) ? ` · nearest d=${v.distance.toFixed(3)}${v.uncertain ? ' (uncertain)' : ''}` : '';
      stage.innerHTML = `
        <div class="astage-imgs">
          <div class="astage-crop"><img src="${cropUrl(rep)}" alt="crop"></div>
          <div class="fimg astage-full"><img src="/media/${rep.id}" data-box='${JSON.stringify(rep.bbox)}'><div class="fbox ${bandOf(rep.score)}" hidden></div></div>
        </div>
        <div class="note" style="margin-top:8px">${v.frames.length} frames · rep ${detPct(rep.score)} · peak ${Math.round((v.peak_score || 0) * 100)}%${dist}</div>
      `;
      // Same box placement (and the same confidence traffic light) the two overviews use —
      // the local copy predated placeBoxes() being hoisted to module scope, and its `warn`
      // class no longer exists on .fbox, so the box had silently reverted to the accent.
      // The box is the REP frame's, so it bands by the REP's own score, which can sit well
      // below the visit's peak — hence "rep %" beside "peak %" above, or the border colour
      // would be a number the operator can't see (and .fbox takes no pointer events, so a
      // title tooltip wouldn't reach it).
      placeBoxes(stage);
    }
    function advanceAfterDecision() {
      visits.splice(idx, 1);
      if (visits.length === 0) { loadQueue(); return; }
      if (idx >= visits.length) idx = visits.length - 1;
      renderVisit();
    }
    async function commitLabel(decision, cat_id) {
      const v = current(); if (!v || busy) return;
      busy = true;
      const withCrop = decision !== 'not_cat';
      const frames = v.frames.map((f) => withCrop ? { frame_id: f.id, bbox: f.bbox, quality: seedQuality(f, v) } : { frame_id: f.id });
      try { await api('POST', '/api/label', { decision, cat_id: cat_id ?? null, frames }); lastAction = v.frames.map((f) => f.id); advanceAfterDecision(); }
      catch (e) { flash('label failed: ' + e.message); }
      finally { busy = false; }
    }
    async function ignoreVisit() {
      const v = current(); if (!v || busy) return;
      busy = true;
      try { await api('POST', '/api/label/ignore', { frame_ids: v.frames.map((f) => f.id) }); lastAction = v.frames.map((f) => f.id); advanceAfterDecision(); }
      catch (e) { flash('ignore failed: ' + e.message); }
      finally { busy = false; }
    }
    async function undoLast() {
      if (!lastAction || busy) { if (!lastAction) flash('nothing to undo'); return; }
      busy = true;
      try { await api('POST', '/api/label/delete', { frame_ids: lastAction }); lastAction = null; loadQueue(); }
      catch (e) { flash('undo failed: ' + e.message); }
      finally { busy = false; }
    }
    function skip(delta) {
      if (mode === 'queue') {
        if (visits.length) { idx = (idx + delta + visits.length) % visits.length; renderVisit(); }
      } else if (lab.length) {
        labIdx = (labIdx + delta + lab.length) % lab.length; renderLabelled();
      }
    }

    async function loadQueue() {
      const stage = $('#aStage', view); stage.innerHTML = '<span class="note">Loading queue…</span>';
      try { const q = await api('GET', '/api/label/queue'); if (!alive) return; visits = q.visits || []; hasModel = !!q.has_model; truncated = !!q.truncated; idx = 0; renderVisit(); }
      catch (e) { stage.innerHTML = `<span class="note bad">${e.message}</span>`; }
    }

    // ---- Labelled review: fix a mislabel without SQL ----------------------
    // The decided mirror of the queue, newest-labelled first — so the most recent
    // mistake is the first thing on screen. Every action routes through the same
    // two endpoints the queue uses, on the same rows, so a correction made here IS
    // the correction; there is no second copy of the labels.
    const LABEL_TEXT = { unknown_cat: 'unknown cat', not_cat: 'not a cat', ignored: 'ignored' };
    const labelKey = (v) => (v.label_kind === 'identified' ? `cat:${v.cat_id}` : v.label_kind);
    const labelText = (v) => (v.label_kind === 'identified'
      ? (v.cat_name || `cat #${v.cat_id}`)
      : (LABEL_TEXT[v.label_kind] || v.label_kind || '—'));
    // The identity chip, in the palette the rest of the console reads: a resident is
    // green and a foreign cat red (via the roster's is_resident — labeled_visits
    // carries the name but not the residency), an unknown cat amber. not_cat /
    // ignored are not identities at all, so they take the muted chip.
    function labelChip(v) {
      if (v.label_kind === 'identified') {
        const c = cats.find((x) => x.id === v.cat_id);
        return identityChip({ cat_id: v.cat_id, cat_name: v.cat_name || (c && c.name), is_resident: !!(c && c.is_resident) });
      }
      if (v.label_kind === 'unknown_cat') return identityChip({ cat_id: null });
      return `<span class="tchip motion">${esc(labelText(v))}</span>`;
    }
    // A re-label re-seeds each crop's grade with the queue's own formula, so the two
    // paths can't grade the same crop differently — and correcting a not-a-cat (whose
    // stored grade is NULL) to a real cat yields graded crops a gallery build can use.
    // A compute build predating the per-frame `score` / `peak_area` fields can't seed,
    // so it falls back to passing the stored grade through (the old console's behaviour)
    // rather than seeding everything 'poor' off a missing peak area.
    const canSeed = (v) => v && v.peak_area != null;
    const qualityFor = (f, v) => (canSeed(v) && f.score != null ? seedQuality(f, v) : (f.quality || null));

    function renderLabelled() {
      renderStatus();
      const stage = $('#aStage', view), v = lab[labIdx];
      if (!v) {
        stage.innerHTML = `<span class="note">${labAll.length
          ? 'No visits carry that label — pick another under “Show label”.'
          : 'Nothing labelled yet — decide some visits in the Queue.'}</span>`;
        return;
      }
      const frames = v.frames.slice().sort((a, b) => a.recv_ts - b.recv_ts);
      const rep = frames.find((f) => f.id === v.rep_frame_id) || frames[0];
      const t0 = frames[0].recv_ts, t1 = frames[frames.length - 1].recv_ts;
      const meta = [
        fmtTs(t0), `${frames.length} frames`, `span ${fmtDuration((t1 - t0) / 1000)}`,
        `rep ${detPct(rep.score)}`, `peak ${detPct(v.peak_score)}`,
        v.relabelled ? 'labelled just now' : `labelled ${fmtTs(v.labeled_ts)}`,
      ].join(' · ');
      stage.innerHTML = `
        <div class="row" style="margin-bottom:10px">
          ${labelChip(v)}
          ${v.mixed ? '<span class="mv-tag" title="Two labelling gestures fell into one visit cluster — re-labelling rewrites both as one.">mixed</span>' : ''}
        </div>
        <div class="astage-imgs">
          <div class="astage-crop"><img src="${cropUrl(rep)}" alt="crop"></div>
          <div class="fimg astage-full"><img src="/media/${rep.id}" data-box='${JSON.stringify(rep.bbox)}'><div class="fbox ${bandOf(rep.score)}" hidden></div></div>
        </div>
        <div class="note" style="margin-top:8px">${meta}</div>
        ${canSeed(v) ? '' : '<div class="note warn" style="margin-top:6px">This compute build predates the per-crop scores a re-label re-seeds from, so each crop keeps its stored grade — a not-a-cat correction stays ungraded and a quality-filtered gallery build will skip it. Pull + restart the compute PC.</div>'}
        <div class="row" style="margin-top:12px">
          <button id="aRelUnknown">Unknown cat (u)</button>
          <button id="aRelNotCat">Not a cat (x)</button>
          <button id="aRequeue" class="danger">Send back to queue (d)</button>
        </div>
        <div class="afilm">${frames.map((f) => `
          <div class="at${f.id === v.rep_frame_id ? ' rep' : ''}">
            <img src="${cropUrl(f)}" loading="lazy" alt="crop">
            ${f.quality ? `<span class="aq" data-q="${esc(f.quality)}">${esc(f.quality)}</span>` : ''}
          </div>`).join('')}</div>
      `;
      placeBoxes(stage);
      $('#aRelUnknown', view).addEventListener('click', () => relabel('unknown_cat', null));
      $('#aRelNotCat', view).addEventListener('click', () => relabel('not_cat', null));
      $('#aRequeue', view).addEventListener('click', requeue);
    }

    // Re-label: the server drops this visit's rows + crop files, then re-commits under
    // the new identity. The visit deliberately STAYS in view (rather than advancing) so
    // the correction is visible — this is the mode you came to in order to check one.
    async function relabel(decision, cat_id) {
      const v = lab[labIdx]; if (!v || busy) return;
      busy = true;
      const withCrop = decision !== 'not_cat';
      const payload = v.frames.map((f) => withCrop
        ? { frame_id: f.id, bbox: f.bbox, quality: qualityFor(f, v) }
        : { frame_id: f.id });
      try {
        const res = await api('POST', '/api/label/relabel', { decision, cat_id: cat_id ?? null, frames: payload });
        v.label_kind = decision;
        v.cat_id = decision === 'identified' ? cat_id : null;
        v.cat_name = decision === 'identified' ? ((cats.find((c) => c.id === cat_id) || {}).name || null) : null;
        v.mixed = false;
        v.relabelled = true;
        v.frames.forEach((f, i) => { f.quality = payload[i].quality || null; });
        // The "Show label" counts are NOT re-derived here: doing so would drop the visit
        // out of a filtered view the instant it was corrected, yanking it off screen.
        // They refresh on the next Reload — a cosmetic lag, deliberately chosen.
        renderLabelled();
        // A re-label DELETES the old rows first, so frames evicted since the visit was
        // labelled come back written to fewer rows than were sent — and at zero the
        // visit silently leaves the labelled feed on the next reload. Say so, rather
        // than let the freshly-drawn chip claim a label that did not persist.
        // (After renderLabelled, which repaints the status line this writes to.)
        const kept = res && res.inserted != null ? res.inserted : payload.length;
        if (kept < payload.length) flash(`re-labelled ${kept} of ${payload.length} frames — the rest are no longer in the store`);
      } catch (e) { flash('re-label failed: ' + e.message); }
      finally { busy = false; }
    }

    // Undo: delete the rows + crop files so the frames re-enter the annotation queue.
    async function requeue() {
      const v = lab[labIdx]; if (!v || busy) return;
      busy = true;
      try {
        await api('POST', '/api/label/delete', { frame_ids: v.frames.map((f) => f.id) });
        lab.splice(labIdx, 1);
        const gi = labAll.indexOf(v); if (gi >= 0) labAll.splice(gi, 1);
        if (labIdx >= lab.length) labIdx = Math.max(0, lab.length - 1);
        // Unlike a re-label, the visit is GONE from both sets, so re-deriving the filter
        // can't resurrect it — and leaving the counts stale would advertise "not a cat (1)"
        // over an empty view. Only re-derive the shown subset when the selected label
        // emptied out (the option vanishes and the select falls back to All); otherwise
        // hold position, so a review pass isn't thrown back to the top of the list.
        const before = $('#aFilter', view).value;
        rebuildFilter();
        if ($('#aFilter', view).value !== before) applyFilter(); else renderLabelled();
      } catch (e) { flash('send back failed: ' + e.message); }
      finally { busy = false; }
    }

    // Options are built from the labels actually PRESENT, with counts, so the filter
    // never offers a label with nothing behind it. Keeps the current selection when it
    // still exists; falls back to All when it doesn't.
    function rebuildFilter() {
      const sel = $('#aFilter', view), prev = sel.value || 'all';
      const counts = new Map();
      for (const v of labAll) {
        const k = labelKey(v), e = counts.get(k) || { text: labelText(v), n: 0 };
        e.n += 1; counts.set(k, e);
      }
      const rank = (k) => (k.startsWith('cat:') ? 0 : k === 'unknown_cat' ? 1 : k === 'not_cat' ? 2 : 3);
      const entries = [...counts.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || a[1].text.localeCompare(b[1].text));
      sel.innerHTML = [`<option value="all">All labels (${labAll.length})</option>`]
        .concat(entries.map(([k, e]) => `<option value="${esc(k)}">${esc(e.text)} (${e.n})</option>`)).join('');
      sel.value = [...sel.options].some((o) => o.value === prev) ? prev : 'all';
    }
    function applyFilter() {
      const k = $('#aFilter', view).value || 'all';
      lab = k === 'all' ? labAll.slice() : labAll.filter((v) => labelKey(v) === k);
      labIdx = 0;
      renderLabelled();
    }
    async function loadLabelled() {
      const stage = $('#aStage', view); stage.innerHTML = '<span class="note">Loading labelled visits…</span>';
      try {
        const r = await api('GET', '/api/label/labeled');
        if (!alive) return;
        labAll = r.visits || [];
        rebuildFilter();
        applyFilter();
      } catch (e) {
        labAll = []; lab = [];
        stage.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
      }
    }

    function setMode(m) {
      mode = m;
      view.querySelectorAll('#aMode button').forEach((b) => b.classList.toggle('sel', b.dataset.m === m));
      $('#aFilterWrap', view).style.display = m === 'labelled' ? '' : 'none';
      $('#aHint', view).innerHTML = m === 'queue'
        ? 'Keys: <b>1–9</b> roster cat · <b>u</b> unknown cat · <b>x</b> not a cat · <b>g</b> ignore · <b>n</b>/→ skip · <b>p</b>/← back · <b>z</b> undo last'
        : 'Keys: <b>1–9</b> re-label to a roster cat · <b>u</b> unknown cat · <b>x</b> not a cat · <b>d</b> send back to the queue · <b>n</b>/→ next · <b>p</b>/← back';
      if (m === 'queue') loadQueue(); else loadLabelled();
    }

    // Retired cats are not labellable, so the digit binding runs over the ACTIVE roster
    // only — the same derivation the Cats page shows in its Key column. Retiring a cat
    // therefore shifts the digits after it; deliberate, and rare enough to prefer over a
    // departed cat holding key 2 forever.
    const pickable = () => cats.filter((c) => c.active);
    function labelCat(i) { const c = pickable()[i]; if (c) decide('identified', c.id); }
    // The decision keys and the roster buttons mean "label" in the queue and "re-label"
    // in Labelled review — one dispatch point, so the two modes can never diverge on
    // which endpoint a digit hits.
    const decide = (d, cat_id) => (mode === 'queue' ? commitLabel(d, cat_id ?? null) : relabel(d, cat_id ?? null));
    function renderRoster() {
      const el = $('#aRoster', view), usable = pickable();
      // Three states, not two: an empty roster and an all-retired one both leave no
      // buttons, but only the second needs to explain why.
      el.innerHTML = usable.length
        ? usable.map((c, i) => `<button class="acat" data-i="${i}">${i < 9 ? (i + 1) + ' · ' : ''}${esc(c.name)}${c.is_resident ? '' : ' (foreign)'}</button>`).join('')
        : (cats.length
          ? `<span class="note warn">Every cat on the roster is retired — un-retire one on <a href="#cats">Cats</a> to label by name.</span>`
          : `<span class="note">No cats yet — add one on <a href="#cats">Cats</a> to label residents.</span>`);
      el.querySelectorAll('.acat').forEach((b) => b.addEventListener('click', () => labelCat(Number(b.dataset.i))));
    }
    async function loadCats() { try { const r = await api('GET', '/api/cats'); if (alive) { cats = r.cats || []; renderRoster(); } } catch (_) {} }

    function onKey(e) {
      // SELECT is in the ignore list because Labelled review has a focusable filter:
      // without it, typing over the dropdown would re-label the visit behind it.
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      const k = e.key;
      if (k >= '1' && k <= '9') { labelCat(parseInt(k, 10) - 1); e.preventDefault(); }
      else if (k === 'u') decide('unknown_cat');
      else if (k === 'x') decide('not_cat');
      else if (k === 'g') { if (mode === 'queue') ignoreVisit(); }
      else if (k === 'n' || k === 'ArrowRight' || k === ' ') { skip(1); e.preventDefault(); }
      else if (k === 'p' || k === 'ArrowLeft') skip(-1);
      else if (k === 'z') { if (mode === 'queue') undoLast(); }
      // In Labelled review the undo IS the requeue, so it takes the destructive keys
      // rather than z (which undoes the queue's LAST action, a different gesture).
      else if (k === 'd' || k === 'Backspace') { if (mode === 'labelled') { requeue(); e.preventDefault(); } }
    }
    document.addEventListener('keydown', onKey);
    $('#aReload', view).addEventListener('click', () => { loadCats(); if (mode === 'queue') loadQueue(); else loadLabelled(); });
    $('#aMode', view).addEventListener('click', (e) => {
      const b = e.target.closest('button[data-m]');
      if (b && b.dataset.m !== mode) setMode(b.dataset.m);
    });
    $('#aFilter', view).addEventListener('change', applyFilter);

    loadCats(); setMode('queue');
    return () => { alive = false; document.removeEventListener('keydown', onKey); };
  }

  // =======================================================================
  //  Cats page — the household roster (rename / resident / retire / notes)
  // =======================================================================
  // Two GETs, joined on id: /api/cats/overview (roster + last_seen_ts) and
  // /api/label/regime-coverage (per-cat crop totals + the day/night split, keyed
  // cat_id). Every edit is a PATCH /api/cats/{id} carrying ONLY the field that
  // changed, so two operators editing different columns can't clobber each other.
  function mountCats(view) {
    view.innerHTML = `
      <div class="card">
        <div class="row"><span id="kStatus" class="note grow">Loading roster…</span><button id="kReload">Reload</button></div>
        <div id="kWrap" class="qwrap"></div>
        <div id="kCovNote" class="note warn" style="margin-top:8px"></div>
        <p class="hint">Retiring a cat drops it from the annotation picker and the household
          dashboard immediately, but it stays in the <i>promoted</i> gallery — still being named
          on new visits — until you build and promote again. Its labels and crops are never
          touched, so un-retiring and rebuilding brings it back. <b>Resident</b> is different:
          it is read when an event is rendered, so a flip shows up on the next load.</p>
      </div>
      <div class="card">
        <h3>Add a cat</h3>
        <div class="row">
          <input id="kNewCat" type="text" placeholder="new cat name" style="width:180px">
          <label class="note"><input id="kResident" type="checkbox" checked> resident</label>
          <button id="kAdd" class="primary">Add cat</button>
          <span id="kAddNote" class="note"></span>
        </div>
        <p class="hint">A cat you name but leave un-resident is a known neighbour — identified by
          name, but never counted as one of ours.</p>
      </div>
    `;

    let alive = true;
    let cats = [], cov = {}, covAvail = false, covReason = null;
    const errors = {};   // cat id -> the last failed edit's message, cleared on success

    // The 1-9 binding the Annotation picker uses: ACTIVE cats in id order. Derived the
    // same way in both places, so the digit shown here is the digit that labels there.
    const pickable = () => cats.filter((c) => c.active);

    function render() {
      const wrap = $('#kWrap', view), status = $('#kStatus', view);
      status.textContent = cats.length
        ? `${cats.length} cat${cats.length === 1 ? '' : 's'} · ${pickable().length} active`
        : 'Empty roster';
      if (!cats.length) {
        wrap.innerHTML = '<span class="note">No cats yet — add the first one below.</span>';
        return;
      }
      const keyOf = {};
      pickable().forEach((c, i) => { if (i < 9) keyOf[c.id] = i + 1; });
      const body = cats.map((c) => {
        const cv = cov[c.id] || {};
        const dn = covAvail ? `${fmtInt(cv.day || 0)} / ${fmtInt(cv.night || 0)}` : '—';
        const err = errors[c.id];
        // Version-stamped URL: an unchanged avatar keeps ONE cacheable URL, a replaced
        // one gets a fresh URL that auto-busts (the scheme entry 85 established).
        const photo = c.has_avatar
          ? `<img src="/api/cats/${c.id}/avatar?v=${c.avatar_version}" alt="">`
          : `<span class="cinitial">${esc((c.name || '?').trim().charAt(0).toUpperCase())}</span>`;
        return `<tr class="crow${c.active ? '' : ' retired'}" data-id="${c.id}">
            <td>
              <div class="cphoto">
                <label title="Upload a photo for this cat">
                  <span class="cthumb">${photo}</span>
                  <span class="ccap">${c.has_avatar ? 'Change' : 'Set'}</span>
                  <input class="cfile" type="file" accept="image/*" aria-label="upload a photo">
                </label>
                ${c.avatar_uploaded ? '<button class="cx" title="Remove the uploaded photo">✕</button>' : ''}
              </div>
            </td>
            <td class="num ckey">${keyOf[c.id] || ''}</td>
            <td class="cedit"><input class="cname" type="text" value="${esc(c.name)}" aria-label="name"></td>
            <td><input class="cres" type="checkbox"${c.is_resident ? ' checked' : ''} aria-label="resident"></td>
            <td><input class="cact" type="checkbox"${c.active ? ' checked' : ''} aria-label="active"></td>
            <td class="cedit"><input class="cnotes" type="text" value="${esc(c.notes || '')}" placeholder="—" aria-label="notes"></td>
            <td class="num">${fmtInt(cv.total || 0)}</td>
            <td class="num">${dn}</td>
            <td class="num">${fmtTs(c.last_seen_ts)}</td>
          </tr>` + (err ? `<tr class="cerr"><td colspan="9">${esc(err)}</td></tr>` : '');
      }).join('');
      wrap.innerHTML = '<table class="qtable ctable">'
        + '<colgroup><col style="width:62px"><col style="width:40px"><col style="width:150px">'
        + '<col style="width:76px"><col style="width:62px"><col><col style="width:62px">'
        + '<col style="width:90px"><col style="width:128px"></colgroup>'
        + '<thead><tr><th>Photo</th><th>Key</th><th>Name</th><th>Resident</th><th>Active</th>'
        + '<th>Notes</th><th class="num">Crops</th><th class="num">Day / night</th>'
        + '<th class="num">Last seen</th></tr></thead><tbody>' + body + '</tbody></table>';
      wire();
    }

    // Re-rendering replaces every input, so a checkbox the operator just clicked would
    // lose focus mid-pass. Remember which control it was (row id + class) and restore it.
    function withFocus(fn) {
      const el = document.activeElement, row = el && el.closest ? el.closest('.crow') : null;
      // First class token only — the control's identity (cname/cnotes/cres/cact). Taking
      // the whole className would build an invalid selector the day one gains a second class.
      const id = row && row.dataset.id, cls = row && el.className.split(' ')[0];
      fn();
      if (!id || !cls) return;
      const back = view.querySelector(`.crow[data-id="${id}"] .${cls}`);
      if (back) back.focus();
    }

    async function patch(id, fields) {
      try {
        const updated = await api('PATCH', `/api/cats/${id}`, fields);
        if (!alive) return;
        delete errors[id];
        cats = cats.map((c) => (c.id === id ? { ...c, ...updated } : c));
      } catch (e) {
        if (!alive) return;
        // The row reverts to the server value on re-render, so the table never shows an
        // edit that didn't persist (a duplicate name is the common case — 400 UNIQUE).
        errors[id] = e.message;
      }
      withFocus(render);
    }

    // EXIF orientation is normalised CLIENT-side because the server's cv2 re-encode drops
    // the EXIF tag — a phone photo POSTed raw would land permanently sideways. Downscale
    // + JPEG here too, so the upload is small. Duplicated from the user dashboard on
    // purpose: the two front doors share no JS (entry 80), so they drift independently.
    async function normalizeImage(file) {
      const MAX_DIM = 1024;
      let src, w, h;
      try {
        src = await createImageBitmap(file, { imageOrientation: 'from-image' });
        w = src.width; h = src.height;
      } catch {
        src = await new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file), im = new Image();
          im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
          im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image we can read')); };
          im.src = url;
        });
        w = src.naturalWidth; h = src.naturalHeight;
      }
      if (!w || !h) throw new Error('not an image we can read');
      const scale = Math.min(1, MAX_DIM / Math.max(w, h));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      canvas.getContext('2d').drawImage(src, 0, 0, canvas.width, canvas.height);
      if (src.close) src.close();
      return await new Promise((resolve, reject) => {
        canvas.toBlob((b) => b ? resolve(b) : reject(new Error('could not encode the image')), 'image/jpeg', 0.9);
      });
    }

    async function uploadAvatar(id, file, cell) {
      cell.classList.add('busy');
      try {
        const blob = await normalizeImage(file);
        const res = await fetch(`/api/cats/${id}/avatar`, {
          method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob,
        });
        if (!res.ok) {
          let detail = '';
          try { detail = (await res.json()).detail || ''; } catch (_) {}
          throw new Error(`${res.status}${detail ? ' ' + detail : ''}`);
        }
        if (!alive) return;
        delete errors[id];
        // Refetch rather than patch in place: the new avatar_version is what stamps a
        // fresh URL, so without it the <img> would keep serving the cached old photo.
        await load();
      } catch (e) {
        if (!alive) return;
        errors[id] = 'photo: ' + e.message;
        cell.classList.remove('busy');
        render();
      }
    }

    async function removeAvatar(id) {
      try {
        await api('DELETE', `/api/cats/${id}/avatar`);
        if (!alive) return;
        delete errors[id];
        await load();
      } catch (e) {
        if (!alive) return;
        errors[id] = 'photo: ' + e.message;
        render();
      }
    }

    function wire() {
      for (const row of view.querySelectorAll('.crow')) {
        const id = Number(row.dataset.id);
        const cell = $('.cphoto', row), fileEl = $('.cfile', row);
        fileEl.addEventListener('change', () => {
          const f = fileEl.files && fileEl.files[0];
          fileEl.value = '';               // let the same file be re-picked after a failure
          if (f) uploadAvatar(id, f, cell);
        });
        const rm = $('.cx', row);
        if (rm) rm.addEventListener('click', () => removeAvatar(id));
        const name = $('.cname', row), notes = $('.cnotes', row);
        const cat = cats.find((c) => c.id === id) || {};
        // Blur is the single commit point; Enter just blurs, so one edit is one request.
        name.addEventListener('blur', () => {
          const v = name.value.trim();
          if (v === (cat.name || '')) return;          // untouched — don't spend a request
          if (!v) { name.value = cat.name; return; }   // empty name is rejected server-side anyway
          patch(id, { name: v });
        });
        notes.addEventListener('blur', () => {
          const v = notes.value.trim();
          if (v === (cat.notes || '')) return;
          patch(id, { notes: v || null });
        });
        for (const el of [name, notes]) {
          el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
        }
        $('.cres', row).addEventListener('change', (e) => patch(id, { is_resident: e.target.checked }));
        $('.cact', row).addEventListener('change', (e) => patch(id, { active: e.target.checked }));
      }
    }

    async function load() {
      try {
        const [overview, coverage] = await Promise.all([
          api('GET', '/api/cats/overview'),
          api('GET', '/api/label/regime-coverage'),
        ]);
        if (!alive) return;
        cats = overview.cats || [];
        cov = {};
        for (const c of coverage.cats || []) cov[c.cat_id] = c;
        covAvail = !!coverage.available;
        covReason = coverage.reason || null;
        $('#kCovNote', view).textContent = covAvail ? '' : (
          covReason === 'location_unset'
            ? 'Day / night is unavailable — set a location on Start.'
            : 'Day / night is unavailable — astral is not installed on the compute PC.');
        render();
      } catch (e) {
        if (alive) $('#kStatus', view).innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
      }
    }

    async function addCat() {
      const field = $('#kNewCat', view), note = $('#kAddNote', view);
      const name = field.value.trim();
      if (!name) return;
      try {
        await api('POST', '/api/cats', { name, is_resident: $('#kResident', view).checked });
        if (!alive) return;
        field.value = '';
        note.className = 'note ok'; note.textContent = 'Added ' + name + '.';
        load();
      } catch (e) { note.className = 'note bad'; note.textContent = e.message; }
    }

    $('#kAdd', view).addEventListener('click', addCat);
    $('#kNewCat', view).addEventListener('keydown', (e) => { if (e.key === 'Enter') addCat(); });
    $('#kReload', view).addEventListener('click', load);

    load();
    return () => { alive = false; };
  }

  // =======================================================================
  //  Model building page (admin-next P5) — build → validate → promote
  // =======================================================================
  function mountModel(view) {
    const qChecks = (p) => `<span class="row" style="gap:14px">
        <label class="note"><input type="checkbox" id="${p}Gallery" checked> gallery</label>
        <label class="note"><input type="checkbox" id="${p}Ok"> ok</label>
        <label class="note"><input type="checkbox" id="${p}Poor"> poor</label>
      </span>`;
    view.innerHTML = `
      <div class="card"><div class="row"><span id="mJob" class="note grow">idle</span></div></div>
      <div class="card">
        <h3>1 · Build gallery</h3>
        <div class="row">${qChecks('b')}<button id="mBuild" class="primary">Build</button><span id="mBuildNote" class="note"></span></div>
        <p class="hint">Defaults to gallery-grade crops only — protect the gallery; widen to ok/poor to A/B.</p>
      </div>
      <div class="card">
        <h3>2 · Validate <span class="note">(feasibility probe, before promote)</span></h3>
        <div class="row">${qChecks('v')}<button id="mValidate">Validate</button><span id="mValNote" class="note"></span></div>
        <div id="mRuns" class="note" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h3>3 · Promote</h3>
        <div id="mCovWarn" class="note warn" style="margin-bottom:6px"></div>
        <div id="mModels"><span class="note">…</span></div>
      </div>
    `;

    let alive = true;
    let covWarning = '';

    const getQualities = (p) => {
      const q = [];
      if ($(`#${p}Gallery`, view).checked) q.push('gallery');
      if ($(`#${p}Ok`, view).checked) q.push('ok');
      if ($(`#${p}Poor`, view).checked) q.push('poor');
      return q.length ? q : null; // empty selection ⇒ null ⇒ all grades (backend contract)
    };

    async function build() {
      $('#mBuildNote', view).textContent = 'starting…';
      try {
        const r = await api('POST', '/api/training/gallery/build', { qualities: getQualities('b') });
        $('#mBuildNote', view).textContent = r.enough === false ? r.message : 'build enqueued';
        if (r.enough !== false) pollJob();
      } catch (e) { $('#mBuildNote', view).textContent = e.message; }
    }
    async function validate() {
      $('#mValNote', view).textContent = 'starting…';
      try {
        const r = await api('POST', '/api/training/feasibility/run', { qualities: getQualities('v') });
        $('#mValNote', view).textContent = r.enough === false ? r.message : 'validation enqueued';
        if (r.enough !== false) pollJob();
      } catch (e) { $('#mValNote', view).textContent = e.message; }
    }
    $('#mBuild', view).addEventListener('click', build);
    $('#mValidate', view).addEventListener('click', validate);

    function modelRow(m) {
      const th = m.threshold == null ? 'uncalibrated' : m.threshold.toFixed(3);
      const chip = m.status === 'active' ? '<span class="pill ok">active</span>' : m.status === 'retired' ? '<span class="pill">retired</span>' : '<span class="pill warn">draft</span>';
      const btn = m.status === 'active' ? '' : m.gallery_available
        ? `<button data-promote="${m.id}">${m.status === 'retired' ? 'Roll back to this' : 'Promote'}</button>`
        : '<span class="note bad">gallery file missing</span>';
      return `<div class="row" style="border-top:1px solid var(--border);padding:8px 0">
        <span class="grow">${chip} v${m.id} · ${m.n_cats} cats · ${m.n_vectors} vectors · threshold ${th}</span>${btn}
      </div>`;
    }
    async function promote(id) {
      if (covWarning && !confirm(covWarning + '\n\nPromote anyway?')) return;
      try { await api('POST', `/api/training/models/${id}/promote`); loadModels(); }
      catch (e) { alert('promote failed: ' + e.message); }
    }
    async function loadModels() {
      try {
        const r = await api('GET', '/api/training/models');
        if (!alive) return;
        const models = r.models || [];
        const el = $('#mModels', view);
        el.innerHTML = models.length ? models.map(modelRow).join('') : '<span class="note">No gallery versions yet — build one above.</span>';
        el.querySelectorAll('button[data-promote]').forEach((b) => b.addEventListener('click', () => promote(Number(b.dataset.promote))));
        checkCoverage();
      } catch (_) {}
    }
    async function checkCoverage() {
      try {
        const r = await api('GET', '/api/label/regime-coverage');
        if (!alive) return;
        const noNight = (r.available ? (r.cats || []) : []).filter((c) => c.is_resident && c.total > 0 && c.night === 0).map((c) => c.cat_name);
        covWarning = noNight.length ? `⚠ No night crops for: ${noNight.join(', ')} — unrecognizable after dark.` : '';
        $('#mCovWarn', view).textContent = covWarning;
      } catch (_) {}
    }
    async function loadRuns() {
      try {
        const r = await api('GET', '/api/training/feasibility/runs');
        if (!alive) return;
        const runs = (r.runs || []).slice(0, 8);
        $('#mRuns', view).innerHTML = runs.length ? runs.map((run) => {
          const acc = run.knn_accuracy != null ? Math.round(run.knn_accuracy * 100) + '%' : '—';
          const auc = run.auc != null ? run.auc.toFixed(3) : '—';
          const th = run.threshold != null ? run.threshold.toFixed(3) : '—';
          const rep = run.report_available ? `<a href="/api/training/feasibility/report/${run.run_id}" target="_blank" rel="noopener">report</a>` : '<span class="note">report pruned</span>';
          return `<div>[${run.quality || 'all'}] kNN ${acc} · AUC ${auc} · thr ${th} · ${rep}</div>`;
        }).join('') : '<span class="note">No validation runs yet.</span>';
      } catch (_) {}
    }

    async function pollJob() {
      try {
        const s = await api('GET', '/api/training/status');
        if (!alive) return;
        const jl = $('#mJob', view);
        if (s.running) {
          jl.innerHTML = `<span class="pill warn">running</span> ${s.kind} <span class="mono">${fmtInt(s.done)}/${fmtInt(s.total)}</span>${s.queue.length ? ' · ' + s.queue.length + ' queued' : ''} <button id="mCancel">Cancel</button>`;
          const c = $('#mCancel', view); if (c) c.addEventListener('click', () => api('POST', '/api/training/cancel').catch(() => {}));
        } else {
          jl.textContent = s.error ? 'last error: ' + s.error : 'idle';
          loadModels(); loadRuns();
        }
      } catch (_) {}
    }

    loadModels(); loadRuns(); pollJob();
    const timer = setInterval(pollJob, 3000);
    return () => { alive = false; clearInterval(timer); };
  }

  // =======================================================================
  //  Activity page (admin-next P6) — recent visits + playback + backfill
  // =======================================================================
  function mountActivity(view) {
    view.innerHTML = `
      <div class="card">
        <div class="row">
          <button id="acReload">Reload</button>
          <label class="note"><input type="checkbox" id="acHide"> Hide our cats</label>
          <span class="grow"></span>
          <button id="acAnalyze" title="Re-detect the loaded events' motion frames (person/bird/cat subjects)">Analyze</button>
          <button id="acIdentify" title="Name historical visits against the active gallery">Identify</button>
        </div>
        <div id="acNote" class="note" style="margin-top:6px"></div>
      </div>
      <div class="card">
        <h3>Recent visits <span class="note">(click to play)</span></h3>
        <div id="acGrid" class="fgrid"><span class="note">Loading…</span></div>
      </div>
    `;

    let alive = true;
    let events = [];
    let modal = null, playerTimer = null;
    // Serializes overlapping openPlayer() calls. It fetches its frames BEFORE building
    // the modal, so two clicks during that fetch would each build one — the first left
    // orphaned in the DOM with its playback interval still ticking. Now only the newest
    // call survives its await. Reachable in practice since a click (not a double-click)
    // opens a visit.
    let playerSeq = 0;

    const span = () => {
      if (!events.length) return null;
      return { since_id: Math.min(...events.map((e) => e.start_id)), until_id: Math.max(...events.map((e) => e.end_id)) };
    };
    const flash = (m) => { $('#acNote', view).textContent = m; };

    function renderGrid() {
      const grid = $('#acGrid', view);
      const hide = $('#acHide', view).checked;
      const shown = events.map((e, i) => [e, i]).filter(([e]) => !(hide && identityKind(e.identity) === 'resident'));
      if (!events.length) { grid.innerHTML = '<span class="note">No visits yet.</span>'; return; }
      if (!shown.length) { grid.innerHTML = '<span class="note">All hidden by the filter.</span>'; return; }
      const p = (x) => String(x).padStart(2, '0');
      grid.innerHTML = shown.map(([ev, i]) => {
        const t = new Date(ev.start_ts);
        return `<div class="ftile" data-i="${i}">
          <div class="fimg"><img loading="lazy" src="/media/${ev.rep_frame_id}">
            <div class="tchips">${eventChip(ev)}${healthDot(ev.detection)}</div></div>
          <div class="fmeta"><span>${p(t.getDate())}/${p(t.getMonth() + 1)} ${p(t.getHours())}:${p(t.getMinutes())}</span><span>${fmtInt(ev.n_frames)}f</span></div>
        </div>`;
      }).join('');
      grid.querySelectorAll('.ftile').forEach((t) => t.addEventListener('click', () => openPlayer(Number(t.dataset.i))));
    }
    async function loadEvents() {
      const grid = $('#acGrid', view); grid.innerHTML = '<span class="note">Loading…</span>';
      try { const d = await api('GET', '/api/events'); if (!alive) return; events = Array.isArray(d) ? d : (d.events || []); renderGrid(); }
      catch (e) { grid.innerHTML = `<span class="note bad">${e.message}</span>`; }
    }

    function closeModal() { if (playerTimer) { clearInterval(playerTimer); playerTimer = null; } if (modal) { modal.remove(); modal = null; } }
