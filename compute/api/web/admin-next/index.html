    async function openPlayer(idx) {
      const ev = events[idx]; if (!ev) return;
      const seq = ++playerSeq;
      closeModal();
      const q = new URLSearchParams({ count: 60, since_id: ev.start_id, until_id: ev.end_id, detections: 'yolo-serial' });
      let pf = [];
      try { const d = await api('GET', '/api/frames/sample?' + q); pf = Array.isArray(d) ? d : (d.frames || []); } catch (e) { flash('Playback: ' + e.message); return; }
      if (!alive || seq !== playerSeq) return;
      if (!pf.length) { flash('No frames left for that visit — they may have been evicted.'); return; }
      closeModal();
      modal = document.createElement('div'); modal.className = 'fmodal player';
      modal.innerHTML = `<div class="inner" style="min-width:320px">
        <div class="fimg" id="pStage"><img id="pImg"><div class="fbox" hidden><span class="boxcap"></span></div></div>
        <div class="row" style="margin-top:8px;align-items:center">
          <button id="pPlay">Pause</button>
          <input id="pScrub" type="range" min="0" max="${pf.length - 1}" value="0" style="flex:1;min-width:0">
          <span id="pIdx" class="note mono">1/${pf.length}</span>
        </div>
        <div id="pCap" class="note" style="margin-top:6px"></div>
        ${statsHtml(ev.detection)}
      </div>`;
      document.body.appendChild(modal);
      const img = $('#pImg', modal), fb = $('#pStage .fbox', modal), cap = $('.boxcap', fb);
      let i = 0;
      // Natural dimensions are learned ONCE from this visit's first frame and cached, so
      // drawBox runs SYNCHRONOUSLY on every frame change. Waiting for each frame's load
      // meant hiding the box and re-showing it 5× a second — the flicker. Safe because
      // the cache is per OPEN VISIT (seconds of frames from one camera config), not
      // global: an ROI/rotation change between visits just re-learns on the next open.
      // It also makes a stale box impossible — the box is drawn from the frame being
      // shown, never from a closure the previous frame left behind on `onload`.
      let natW = null, natH = null;
      const capEl = $('#pCap', modal);
      function drawBox(f) {
        const band = bandOf(f.score);
        const txt = detLabel(f);
        capEl.textContent = txt;
        if (!f.box || !natW) { fb.hidden = true; return; }
        // Per-FRAME truth, so a person box can show mid-cat visit; the band matches the
        // Frame-review and user-dashboard colouring for the same confidence.
        fb.className = 'fbox ' + band;
        fb.style.cssText = 'position:absolute;box-sizing:border-box;' + boxStyle(f.box, natW, natH);
        cap.className = 'boxcap ' + band;
        cap.textContent = txt;
        fb.hidden = false;
      }
      img.addEventListener('load', () => {
        if (natW == null && img.naturalWidth) { natW = img.naturalWidth; natH = img.naturalHeight; }
        drawBox(pf[i]);   // the first frame's box, now that dimensions are known
      });
      function show(n) {
        i = n; const f = pf[i];
        img.src = f.url;
        $('#pScrub', modal).value = i; $('#pIdx', modal).textContent = (i + 1) + '/' + pf.length;
        drawBox(f);
      }
      const play = () => { $('#pPlay', modal).textContent = 'Pause'; playerTimer = setInterval(() => show((i + 1) % pf.length), 200); };
      const pause = () => { $('#pPlay', modal).textContent = 'Play'; if (playerTimer) { clearInterval(playerTimer); playerTimer = null; } };
      $('#pPlay', modal).addEventListener('click', () => (playerTimer ? pause() : play()));
      $('#pScrub', modal).addEventListener('input', (e) => { pause(); show(Number(e.target.value)); });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      show(0); play();
    }
    function onKey(e) { if (e.key === 'Escape') closeModal(); }
    document.addEventListener('keydown', onKey);

    async function identifyPass() {
      const s = span(); if (!s) return;
      try { await api('POST', '/api/identify/run', s); flash('Identify enqueued — progress on Model building.'); }
      catch (e) { flash('Identify: ' + e.message); }
    }
    async function analyzePass() {
      const s = span(); if (!s) return;
      try { await api('POST', '/api/analysis/run', { analyzer: 'yolo-serial', reanalyze: true, motion_only: true, ...s }); flash('Analyze enqueued — progress on Motion tuning.'); }
      catch (e) { flash('Analyze: ' + e.message); }
    }
    $('#acReload', view).addEventListener('click', loadEvents);
    $('#acHide', view).addEventListener('change', renderGrid);
    $('#acIdentify', view).addEventListener('click', identifyPass);
    $('#acAnalyze', view).addEventListener('click', analyzePass);

    loadEvents();
    return () => { alive = false; closeModal(); document.removeEventListener('keydown', onKey); };
  }
</script>
